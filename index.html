
<!DOCTYPE html>
<html lang="en">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Employee Attendance Pro</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 20px;
      background: #f1f5f9;
      color: #172033;
      font-family: Arial, sans-serif;
    }

    .card {
      max-width: 480px;
      margin: 25px auto;
      padding: 24px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 5px 24px rgba(0,0,0,.08);
    }

    h1 { font-size: 24px; margin-top: 0; }
    h2 { font-size: 19px; margin-top: 24px; }

    label {
      display: block;
      margin: 14px 0 6px;
      font-size: 14px;
      font-weight: bold;
    }

    input, select, button {
      width: 100%;
      min-height: 46px;
      padding: 12px;
      border-radius: 8px;
      font-size: 16px;
    }

    input, select {
      border: 1px solid #cbd5e1;
      background: white;
    }

    button {
      margin-top: 16px;
      border: 0;
      background: #176b45;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled { opacity: .6; }

    .secondary { background: #475569; }

    .notice {
      margin-top: 16px;
      padding: 12px;
      border-radius: 8px;
      background: #f1f5f9;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-size: 14px;
    }

    .hidden { display: none; }
  </style>
</head>

<body>
  <main class="card">
    <h1>Employee Attendance Pro</h1>
    <p>Admin Login and User Creation</p>

    <section id="loginSection">
      <h2>Admin Login</h2>

      <form id="loginForm">
        <label for="adminUsername">Username</label>
        <input id="adminUsername" autocomplete="username"
               required maxlength="30">

        <label for="adminPassword">Password</label>
        <input id="adminPassword" type="password"
               autocomplete="current-password" required>

        <button id="loginButton" type="submit">Login</button>
      </form>
    </section>

    <section id="dashboard" class="hidden">
      <h2 id="welcome"></h2>
      <p>Create a new employee account.</p>

      <form id="employeeForm">
        <label for="username">Employee Username</label>
        <input id="username" autocomplete="off"
               minlength="4" maxlength="30"
               pattern="[a-zA-Z0-9._-]+"
               required>

        <label for="fullName">Full Name</label>
        <input id="fullName" maxlength="100"
               autocomplete="name" required>

        <label for="department">Department</label>
        <select id="department" required>
          <option value="">Select department</option>
          <option>Construction</option>
          <option>Civil</option>
          <option>Purchase</option>
          <option>Electrical</option>
          <option>Plumbing</option>
          <option>Office</option>
          <option>Other</option>
        </select>

        <label for="employeePassword">Temporary Password</label>
        <input id="employeePassword" type="password"
               minlength="12" maxlength="128"
               autocomplete="new-password" required>

        <button id="createButton" type="submit">
          Create User
        </button>
      </form>

      <button id="logoutButton" class="secondary" type="button">
        Logout
      </button>
    </section>

    <div id="message" class="notice" role="status" aria-live="polite">
      Enter your Admin credentials.
    </div>
  </main>

  <script>
    let adminToken = null;

    const loginSection = document.getElementById('loginSection');
    const dashboard = document.getElementById('dashboard');
    const message = document.getElementById('message');

    function showMessage(text) {
      message.textContent = text;
    }

    document.getElementById('loginForm').addEventListener(
      'submit', function(event) {
        event.preventDefault();

        const button = document.getElementById('loginButton');
        button.disabled = true;
        showMessage('Checking login...');

        google.script.run
          .withSuccessHandler(function(result) {
            button.disabled = false;

            if (!result || !result.success || !result.token) {
              showMessage('Login failed. Please try again.');
              return;
            }

            adminToken = result.token;
            loginSection.classList.add('hidden');
            dashboard.classList.remove('hidden');

            document.getElementById('welcome').textContent =
              'Welcome, ' + result.fullName;

            document.getElementById('adminPassword').value = '';
            showMessage('Login successful.');
          })
          .withFailureHandler(function(error) {
            button.disabled = false;
            showMessage(error && error.message
              ? error.message : 'Login failed.');
          })
          .loginAdmin(
            document.getElementById('adminUsername').value.trim(),
            document.getElementById('adminPassword').value
          );
      }
    );

    document.getElementById('employeeForm').addEventListener(
      'submit', function(event) {
        event.preventDefault();

        if (!adminToken) {
          showMessage('Please log in again.');
          return;
        }

        const button = document.getElementById('createButton');
        button.disabled = true;
        showMessage('Creating employee account...');

        const data = {
          username: document.getElementById('username').value.trim(),
          fullName: document.getElementById('fullName').value.trim(),
          department: document.getElementById('department').value,
          password: document.getElementById('employeePassword').value
        };

        google.script.run
          .withSuccessHandler(function(result) {
            button.disabled = false;

            if (result && result.success) {
              document.getElementById('employeeForm').reset();
              showMessage(result.message);
            } else {
              showMessage('Could not create the user.');
            }
          })
          .withFailureHandler(function(error) {
            button.disabled = false;
            showMessage(error && error.message
              ? error.message : 'Could not create the user.');
          })
          .createEmployee(adminToken, data);
      }
    );

    document.getElementById('logoutButton').addEventListener(
      'click', function() {
        const token = adminToken;
        adminToken = null;

        dashboard.classList.add('hidden');
        loginSection.classList.remove('hidden');
        document.getElementById('employeeForm').reset();
        document.getElementById('loginForm').reset();

        google.script.run.logoutAdmin(token);
        showMessage('You have logged out.');
      }
    );
  </script>
</body>
</html>
