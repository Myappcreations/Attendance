
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#176b45">
  <title>Employee Attendance Pro</title>

  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 20px;
      background: #f2f5f9;
      color: #172033;
      font-family: Arial, sans-serif;
    }

    .card {
      max-width: 440px;
      margin: 25px auto;
      padding: 24px;
      background: white;
      border-radius: 18px;
      box-shadow: 0 5px 24px #0000000d;
    }

    h1 { font-size: 25px; margin-bottom: 8px; }
    h2 { font-size: 20px; margin-top: 24px; }

    .muted {
      color: #667085;
      font-size: 14px;
      line-height: 1.5;
    }

    label {
      display: block;
      margin: 17px 0 7px;
      font-size: 14px;
      font-weight: 600;
    }

    input, select, button {
      width: 100%;
      min-height: 48px;
      padding: 12px;
      border-radius: 9px;
      font-size: 16px;
    }

    input, select {
      border: 1px solid #d0d5dd;
      background: white;
    }

    button {
      margin-top: 20px;
      border: 0;
      background: #176b45;
      color: white;
      font-weight: bold;
    }

    button:disabled {
      opacity: 0.55;
    }

    .notice {
      margin-top: 18px;
      padding: 12px;
      border-radius: 9px;
      background: #eef4f0;
      color: #176b45;
      font-size: 13px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    #googleButton {
      margin-top: 16px;
      display: flex;
      justify-content: center;
    }
  </style>
</head>

<body>
  <main class="card">
    <h1>Employee Attendance Pro</h1>
    <p class="muted">
      Employee registration and site attendance
    </p>

    <h2>1. Google Sign-In</h2>
    <p class="muted">
      Sign in with the Google account you want to register.
    </p>

    <div id="googleButton"></div>
    <p id="signInStatus" class="notice" role="status">
      Loading Google Sign-In...
    </p>

    <h2>2. Register Employee</h2>

    <form id="registerForm">
      <label for="name">Full Name</label>
      <input id="name" name="fullName"
             autocomplete="name" required maxlength="100">

      <label for="mobile">Mobile Number</label>
      <input id="mobile" name="mobile" type="tel"
             inputmode="numeric" pattern="[0-9]{10}"
             maxlength="10" required>

      <label for="department">Department</label>
      <select id="department" name="department" required>
        <option value="">Select department</option>
        <option>Construction</option>
        <option>Purchase</option>
        <option>Electrical</option>
        <option>Plumbing</option>
        <option>Admin</option>
        <option>Other</option>
      </select>

      <button id="registerButton" type="submit" disabled>
        Register
      </button>
    </form>

    <p id="message" class="notice" role="status">
      Sign in first. Registration backend is not connected yet.
    </p>
  </main>

  <script>
    const GOOGLE_CLIENT_ID =
      "741966424487-uf45m6oqsv7cm227erdskqsds9lngnlr.apps.googleusercontent.com";

    let googleIdToken = null;

    const signInStatus = document.getElementById("signInStatus");
    const registerButton = document.getElementById("registerButton");
    const message = document.getElementById("message");

    function handleGoogleSignIn(response) {
      if (!response || !response.credential) {
        signInStatus.textContent = "Google Sign-In failed. Please try again.";
        return;
      }

      // Keep the token in memory only. Never save it in a URL,
      // localStorage, sessionStorage, or console logs.
      googleIdToken = response.credential;

      signInStatus.textContent =
        "Google Sign-In completed. Server verification is still required.";

      registerButton.disabled = false;

      message.textContent =
        "You can complete the form, but registration is not submitted yet.";
    }

    function initializeGoogleSignIn() {
      if (!window.google || !google.accounts || !google.accounts.id) {
        signInStatus.textContent =
          "Google Sign-In could not load. Refresh the page and try again.";
        return;
      }

      google.accounts.id.initialize({
        client_id: GOOGLE_CLIENT_ID,
        callback: handleGoogleSignIn
      });

      google.accounts.id.renderButton(
        document.getElementById("googleButton"),
        {
          theme: "outline",
          size: "large",
          text: "signin_with",
          shape: "rectangular",
          width: 280
        }
      );

      signInStatus.textContent =
        "Tap the Google button to sign in.";
    }

    function waitForGoogle() {
      if (window.google && google.accounts && google.accounts.id) {
        initializeGoogleSignIn();
      } else {
        setTimeout(waitForGoogle, 300);
      }
    }

    document.getElementById("registerForm").addEventListener(
      "submit",
      function(event) {
        event.preventDefault();

        if (!googleIdToken) {
          message.textContent = "Please sign in with Google first.";
          return;
        }

        message.textContent =
          "Not submitted: secure Apps Script registration connection " +
          "is not enabled yet. Your details have not been sent.";
      }
    );

    waitForGoogle();
  </script>
</body>
</html>
